name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Three operating systems: nothing here touches the filesystem today, but
    # line endings in a checkout change what gofmt and golden octets see, and
    # that is exactly the kind of difference that breaks quietly on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt'd:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - name: Build without cgo
        shell: bash
        run: CGO_ENABLED=0 go build ./...
      - run: go test -race -cover ./...
      # The W3C interop vectors, a nested module so they never ship in the
      # library's module download.
      - name: W3C XML Signature 1.1 interop vectors
        working-directory: tests/w3c
        shell: bash
        run: go vet ./... && go test ./...
      # Every statement is covered, and stays so. An unreachable branch is
      # deleted, not excused; see docs/testing.md.
      - name: 100% statement coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')
          echo "total coverage: $total"
          if [ "$total" != "100.0%" ]; then
            go tool cover -func=cover.out | grep -v '100.0%$'
            echo "::error::statement coverage is $total, not 100.0%"; exit 1
          fi

  interop:
    # The differential against xmlsec1 1.3 and Apache Santuario: signatures,
    # signature byte-equality and encryption, in both directions. Run through
    # the same container script as locally (tests/Dockerfile): it needs xmlsec
    # 1.3, and Ubuntu packages 1.2, which lacks XML Encryption 1.1 rsa-oaep.
    # The script sets GOXMLSEC_REQUIRE_INTEROP, so a missing tool fails
    # rather than skips.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/interop.sh

  lint:
    # Acceptance criterion 18. Versions are pinned so a linter release cannot
    # fail the build unannounced; bump them deliberately.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      # The interop tests build only under -tags interop, and the W3C
      # vectors are a nested module ./... does not reach. gosec skips test
      # files, which is all either holds, so it has nothing more to see.
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -tags interop ./...
      - name: staticcheck tests/w3c
        working-directory: tests/w3c
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet ./...

  hygiene:
    # The module must know nothing of the profiles that consume it: no import
    # of a peppol-* module, and no mention of one in Go source outside
    # internal/ test fixtures. Docs may name the consumer; code may not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: No peppol imports
        run: |
          if go list -deps -test ./... | grep -i peppol; then
            echo "::error::go-xmlsec must not import any peppol module"; exit 1
          fi
      - name: No peppol in Go source outside internal/
        run: |
          if grep -rli peppol --include='*.go' --exclude-dir=internal .; then
            echo "::error::the string \"peppol\" appears in Go source outside internal/"; exit 1
          fi
